<div class="loyaltyengage-pagebuilder-meta"
     attr="data.main.attributes"
     ko-style="data.main.style"
     css="data.main.css">
    <div class="loyaltyengage-pagebuilder-meta__card">
        <div class="loyaltyengage-pagebuilder-meta__header"
             if="data.main.attributes()['data-title']">
            <strong class="loyaltyengage-pagebuilder-meta__title"
                    text="data.main.attributes()['data-title']"></strong>
        </div>
        <div class="loyaltyengage-pagebuilder-meta__body"
             data-role="loyalty-meta-body">
            <p class="loyaltyengage-pagebuilder-meta__empty"
               text="data.main.attributes()['data-empty-message'] || 'Log in om je loyalty gegevens te bekijken.'"></p>
        </div>
    </div>
</div>
